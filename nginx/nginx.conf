# DebtFlow — Nginx production (HTTP).
# Một domain duy nhất: /  → React build tĩnh · /api → NestJS API.
# Bật HTTPS: xem nginx-ssl.conf.template + deploy/init-letsencrypt.sh.

server {
    listen 80;
    server_name _;

    # ACME challenge cho Let's Encrypt (webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Backend API — giữ nguyên URI /api/v1/... khi proxy.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React SPA — fallback về index.html cho client-side routing.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Cache tài nguyên build có hash trong tên file.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers cơ bản.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 5m;
}
