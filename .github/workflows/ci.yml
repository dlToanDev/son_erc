name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build shared package
        run: npm run build --workspace packages/shared

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  # Xác nhận 2 image production build được (không push).
  build-images:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t debtflow-api:ci .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t debtflow-web:ci .
