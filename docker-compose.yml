# DebtFlow — môi trường phát triển (dev).
# Production compose (migrate deploy + nginx + TLS) sẽ làm ở Phase 9.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-debtflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-debtflow_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-debtflow}
    ports:
      - '5443:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-debtflow}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://debtflow:debtflow_dev_pw@postgres:5432/debtflow?schema=public}
      API_PORT: ${API_PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
    command: sh -c "npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run dev --workspace apps/api"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:3000}
      WEB_PORT: ${WEB_PORT:-5173}
    ports:
      - '${WEB_PORT:-5173}:5173'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
    command: sh -c "npm run dev --workspace apps/web"

volumes:
  pgdata:
